<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <!-- ========== 首页视图 ========== -->
    <section id="homeView" class="view active">
      <header class="top-bar">
        <div class="title-bar">
          <h1 class="app-title">FZU失物招领平台</h1>
        </div>
        <div class="search-area">
          <div class="search-bar">
            <input id="searchInput" type="text" placeholder="搜索物品名称、地点、描述">
          </div>
          <div class="tab-bar">
            <button id="tabLost" class="tab-btn active" data-type="lost"><span>寻找物品</span></button>
            <button id="tabFound" class="tab-btn" data-type="found"><span>寻找失主</span></button>
            <div class="tab-indicator"></div>
          </div>
        </div>
      </header>
      <main id="itemList" class="item-list">
        <div class="empty-state" id="emptyState">无相关信息</div>
      </main>
      <nav class="bottom-nav">
        <button class="nav-btn active" id="navHome">首页</button>
        <button class="nav-btn nav-plus" id="navAdd">+</button>
        <button class="nav-btn" id="navMine">我的</button>
      </nav>
    </section>

    <!-- ========== 发布视图 ========== -->
    <section id="publishView" class="view">
      <header class="top-bar">
        <div class="title-bar publish-title-bar">
          <button id="backBtn" class="back-btn">←</button>
          <h1 class="app-title">发布消息</h1>
          <span class="title-placeholder"></span>
        </div>
      </header>
      <main class="publish-body">
        <form id="publishForm" novalidate>
          <div class="form-group">
            <label class="form-label">类型 <span class="required">*</span></label>
            <div class="type-options">
              <label class="type-option"><input type="radio" name="type" value="lost"><span>寻找物品</span></label>
              <label class="type-option"><input type="radio" name="type" value="found"><span>寻找失主</span></label>
            </div>
            <p class="error-msg" id="err-type"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-title">物品名称 <span class="required">*</span></label>
            <input id="p-title" name="title" type="text" class="form-input" placeholder="例如：校园卡、蓝牙耳机">
            <p class="error-msg" id="err-title"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-desc">物品描述</label>
            <textarea id="p-desc" name="desc" class="form-textarea" placeholder="颜色、品牌、特征等（选填）"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-date">失物 / 拾物时间 <span class="required">*</span></label>
            <input id="p-date" name="date" type="date" class="form-input">
            <p class="error-msg" id="err-date"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-place">失物 / 拾物地点 <span class="required">*</span></label>
            <input id="p-place" name="place" type="text" class="form-input" placeholder="例如：图书馆三楼">
            <p class="error-msg" id="err-place"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-image">上传图片</label>
            <input id="p-image" name="image" type="file" accept="image/*" class="form-file">
            <div id="imagePreview" class="image-preview"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-contact">联系方式 <span class="required">*</span></label>
            <input id="p-contact" name="contact" type="text" class="form-input" placeholder="QQ / 微信 / 手机号">
            <p class="error-msg" id="err-contact"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="p-remark">备注</label>
            <textarea id="p-remark" name="remark" class="form-textarea" placeholder="其他想说明的信息（选填）"></textarea>
          </div>
          <button type="submit" id="submitBtn" class="submit-btn">确认发布</button>
        </form>
      </main>
    </section>

    <!-- ========== 详情视图 ========== -->
    <section id="detailView" class="view">
      <header class="top-bar">
        <div class="title-bar publish-title-bar">
          <button id="detailBackBtn" class="back-btn">←</button>
          <h1 class="app-title">物品详情</h1>
          <span class="title-placeholder"></span>
        </div>
      </header>
      <main class="publish-body">
        <div id="detailImageWrap" class="detail-image-wrap"></div>
        <div class="detail-meta">
          <span id="detailTag" class="tag"></span>
          <span id="detailStatus" class="detail-status"></span>
        </div>
        <h2 id="detailTitle" class="detail-title"></h2>
        <div class="detail-info-block">
          <div class="detail-row"><span class="detail-label">描述</span><span id="detailDesc" class="detail-value"></span></div>
          <div class="detail-row"><span class="detail-label">时间</span><span id="detailDate" class="detail-value"></span></div>
          <div class="detail-row"><span class="detail-label">地点</span><span id="detailPlace" class="detail-value"></span></div>
          <div class="detail-row"><span class="detail-label">联系方式</span><span id="detailContact" class="detail-value"></span></div>
          <div class="detail-row"><span class="detail-label">备注</span><span id="detailRemark" class="detail-value"></span></div>
        </div>
      </main>
    </section>

    <!-- ========== 我的视图 ========== -->
    <section id="mineView" class="view">
      <header class="top-bar">
        <div class="title-bar publish-title-bar">
          <button id="mineBackBtn" class="back-btn">←</button>
          <h1 class="app-title">我的发布</h1>
          <span class="title-placeholder"></span>
        </div>
      </header>
      <main id="mineList" class="item-list"></main>
      <nav class="bottom-nav">
        <button class="nav-btn" id="navHomeMine">首页</button>
        <button class="nav-btn nav-plus" id="navAddMine">+</button>
        <button class="nav-btn active" id="navMineMine">我的</button>
      </nav>
    </section>

  </div>

  <!-- 发布成功提示 -->
  <div id="toast" class="toast">发布成功！</div>

  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
